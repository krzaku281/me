name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile --ignore-scripts

      - name: Audit dependencies
        run: |
          if yarn audit --json > yarn-audit.json; then
            audit_status=0
          else
            audit_status=$?
          fi
          node scripts/report-yarn-audit.js "$audit_status"

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('yarn-audit.json') != ''
        with:
          name: dependency-audit-report
          path: yarn-audit.json
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile --ignore-scripts

      - name: Cache optimized image variants
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/imagetools
          key: ${{ runner.os }}-imagetools-${{ hashFiles('yarn.lock') }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-imagetools-${{ hashFiles('yarn.lock') }}-

      - run: node node_modules/playwright/cli.js install --only-shell chromium webkit

      - run: yarn run test:e2e

      - name: Upload E2E coverage
        if: always() && hashFiles('coverage-reports/e2e/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage
          path: coverage-reports/e2e/lcov.info
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile --ignore-scripts

      - run: yarn run check && yarn run lint

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile --ignore-scripts

      - name: Cache optimized image variants
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/imagetools
          key: ${{ runner.os }}-imagetools-${{ hashFiles('yarn.lock') }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-imagetools-${{ hashFiles('yarn.lock') }}-

      - id: pages
        uses: actions/configure-pages@v5

      - run: yarn build
        env:
          # Project sites are published under /<repository>.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request'
    needs: [test, lint, audit, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  sonar:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: e2e-coverage
          path: coverage-reports/e2e

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
